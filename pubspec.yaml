name: skinaliz
description: A comparing face & manage progress.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  camera: ^0.11.0+2
  path_provider: ^2.1.4
  share_plus: ^10.0.2
  image_picker: ^1.1.2
  exif: ^3.3.0
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1

flutter_icons:
 image_path: "icon/icon_master.png"
 android: true
 ios: true

flutter:
  config:
    enable-swift-package-manager: false

  uses-material-design: true
